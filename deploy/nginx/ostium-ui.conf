# Ostium 管理 UI 的 Nginx 反向代理示例。
# 用法：
#   sudo cp deploy/nginx/ostium-ui.conf /etc/nginx/conf.d/ostium-ui.conf
#   替换 admin.example.com 和证书路径
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前提：Ostium 的 UI 监听 127.0.0.1:8443（--behind-proxy 或 config.toml）。
# ACME webroot 目录：/var/www/certbot

map $http_upgrade $ostium_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    # certbot --webroot -w /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 自带 Nginx 1.24 用这种写法。
    # Nginx 1.25.1+ 可改为：listen 443 ssl; + http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OstiumTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Ostium 控制面本身限制请求体为 20 MiB，这里保持一致，避免 Nginx
    # 接受超大请求后才由应用拒绝。
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append: Ostium trusts the last hop from loopback.
        # Appending would preserve a client-supplied spoofed first value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket /api/v1/events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ostium_connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
