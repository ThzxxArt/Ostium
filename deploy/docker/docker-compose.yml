services:
  ostium:
    image: ghcr.io/thzxxart/ostium:0.1.0
    container_name: ostium
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      OSTIUM_ROLE: server
      OSTIUM_ADMIN_PASSWORD: ${OSTIUM_ADMIN_PASSWORD:-}
      OSTIUM_DOMAIN: ${OSTIUM_DOMAIN:-}
    volumes:
      - ostium-data:/var/lib/ostium
      - ostium-etc:/etc/ostium
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ostium-data:
  ostium-etc:
