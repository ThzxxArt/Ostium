# Hardened single-container server deployment.
#
# Host networking is used so sing-box can bind 80/443.  The admin UI stays on
# loopback by default; reach it through an SSH tunnel, host Nginx/Caddy with
# TLS, or explicitly opt into a public bind with a firewall.
services:
  ostium:
    # GHCR publishes <version>, v<version> and latest; latest is used here so a
    # fresh checkout does not request an unpublished version. Pin an immutable
    # digest or version tag for production reproducibility.
    image: ghcr.io/thzxxart/ostium:latest
    container_name: ostium
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # File capabilities on the Python/sing-box binaries are used to bind
    # 80/443 as the non-root `ostium` user; no-new-privileges would disable
    # them, so it is intentionally not set here.  The image is read-only,
    # drops all other capabilities and runs unprivileged.
    environment:
      OSTIUM_ROLE: server
      OSTIUM_HOST: 127.0.0.1
      OSTIUM_ALLOW_INSECURE_BIND: "false"
      OSTIUM_ADMIN_PASSWORD: ${OSTIUM_ADMIN_PASSWORD:-}
      OSTIUM_DOMAIN: ${OSTIUM_DOMAIN:-}
    volumes:
      - ostium-data:/var/lib/ostium
      - ostium-etc:/etc/ostium
    healthcheck:
      test:
        - CMD-SHELL
        - 'port="$${OSTIUM_PORT:-8443}"; curl -fsSk "https://127.0.0.1:$port/healthz" >/dev/null 2>&1 || curl -fsS "http://127.0.0.1:$port/healthz"'
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ostium-data:
  ostium-etc:
