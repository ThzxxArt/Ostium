name: ostium

x-common: &ostium-common
  image: ostium-server:${OSTIUM_VERSION:-0.2.0}
  build:
    context: ../..
    dockerfile: Dockerfile
    args:
      VERSION: ${OSTIUM_VERSION:-0.2.0}
      BUILD_COMMIT: ${OSTIUM_BUILD_COMMIT:-unknown}
  env_file:
    - ./ostium.env
  environment:
    DJANGO_SETTINGS_MODULE: ostium.config.settings.prod
    OSTIUM_DATA_DIR: /var/lib/ostium
    OSTIUM_SINGBOX_PATH: /opt/ostium/core/sing-box
    # OSTIUM_DB_URL comes from ./ostium.env (env_file) so the postgres
    # profile can be selected without editing this file.
  volumes:
    - ostium-data:/var/lib/ostium
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *ostium-common
    environment:
      DJANGO_SETTINGS_MODULE: ostium.config.settings.prod
      OSTIUM_DATA_DIR: /var/lib/ostium
      OSTIUM_SINGBOX_PATH: /opt/ostium/core/sing-box
      OSTIUM_CLASH_URL: http://worker:19090
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ostium migrate --noinput && ostium collectstatic --noinput && ostium web --bind 0.0.0.0:8000 --workers 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *ostium-common
    environment:
      DJANGO_SETTINGS_MODULE: ostium.config.settings.prod
      OSTIUM_DATA_DIR: /var/lib/ostium
      OSTIUM_SINGBOX_PATH: /opt/ostium/core/sing-box
      OSTIUM_CLASH_BIND: 0.0.0.0:19090
    command: ["worker"]
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "443:443/tcp"
      - "443:443/udp"
      - "8388:8388/tcp"

  jobs:
    <<: *ostium-common
    command: ["qcluster"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    environment:
      OSTIUM_DOMAIN: ${OSTIUM_DOMAIN:-localhost}
      OSTIUM_ACME_EMAIL: ${OSTIUM_ACME_EMAIL:-admin@localhost}
      OSTIUM_UPSTREAM: web:8000
    volumes:
      - ../caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ostium/tls:/etc/ostium/tls:ro
      - /var/www/certbot:/var/www/certbot:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ostium
      POSTGRES_USER: ostium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ostium-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ostium -d ostium"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ostium-data:
  caddy-data:
  ostium-postgres:
