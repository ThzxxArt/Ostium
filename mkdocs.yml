site_name: Ostium 文档
site_description: 双角色私人 VPN / 通用代理控制台
repo_url: https://github.com/ThzxxArt/Ostium
repo_name: ThzxxArt/Ostium
docs_dir: docs
theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到浅色
    - scheme: default
      primary: teal
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到深色
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - 首页: index.md
  - 架构: architecture.md
  - 指南:
      - 一键安装: guides/install.md
      - 服务管理: guides/service-manager.md
      - Nginx 共存: guides/nginx.md
      - 服务端: guides/server.md
      - 客户端: guides/client.md
      - TUN: guides/tun.md
      - ACME: guides/acme.md
      - 订阅: guides/subscription.md
      - Web UI: guides/ui.md
  - 参考:
      - CLI: reference/cli.md
      - API: reference/api.md
      - Profile v1: reference/profile.md
      - 端口与路径: reference/ports.md
  - 运维:
      - 备份: operations/backup.md
      - 升级: operations/upgrade.md
      - 故障排查: operations/troubleshooting.md
  - 设计:
      - 设计系统: design-system.md
      - UX: ux.md
      - ADR 0001 - TypeScript 6: adr/0001-typescript-6.md
  - 安全: security/threat-model.md
