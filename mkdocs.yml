site_name: Ostium Server
site_description: Linux single-host private proxy server with standard subscriptions
site_url: https://github.com/ThzxxArt/Ostium
repo_url: https://github.com/ThzxxArt/Ostium
repo_name: ThzxxArt/Ostium
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到浅色
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到深色
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 安装: installation.md
  - 从零部署教程: tutorials/from-zero.md
  - 配置: configuration.md
  - 订阅: subscriptions.md
  - 协议: protocols.md
  - 证书: certificates.md
  - 架构: architecture.md
  - 安全: security.md
  - API: api.md
  - CLI: cli.md
  - 运维:
      - 备份与恢复: operations/backup-restore.md
      - 升级: operations/upgrade.md
      - 监控: operations/monitoring.md
      - PyPI 发布: operations/publishing.md
      - 排障: operations/troubleshooting.md
      - E2E 验证: operations/e2e-evidence.md
  - 参考:
      - 设置项: reference/settings.md
      - 订阅格式: reference/formats.md
      - 端口: reference/ports.md
      - PyPI 包说明: pypi-readme.md
  - 质量:
      - 0.2.8 订阅链接修复: review/0.2.8-subscription-links.md
      - 0.2.7 控制台导航审计: review/0.2.7-navigation-audit.md
      - 0.2.5 全页面 UI 审计: review/0.2.5-ui-audit.md
      - 发布前验收: review/0.2.0-pre-release-audit.md
      - 发布前回归: review/0.2.0-pre-release-regression.md
      - 完成度审计（历史）: review/0.2.0-completion-audit.md
      - 回归报告（历史）: review/0.2.0-regression-report.md
  - 设计文档:
      - 最终方案: design/v0.2.0-final.md
      - 实施决策: design/decisions.md

strict: true
