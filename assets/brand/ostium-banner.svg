    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(980 300) rotate(-140) scale(420 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity=".20"/>
