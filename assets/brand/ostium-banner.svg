      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(190 80) rotate(48) scale(330 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity=".26"/>
