name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src/ostium
      - run: >-
          uv run pytest -m "not integration" --cov=ostium
          --cov-report=xml --cov-report=json:coverage.json --cov-report=term
      - run: uv run python scripts/coverage_gate.py coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: node ../scripts/check-web-budget.mjs
      - run: npm run format:check
      - uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  wheel:
    runs-on: ubuntu-24.04
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: test -f web/dist/index.html
      - run: uv build
      - run: uv run python -m pip install --force-reinstall dist/*.whl
      - run: .venv/bin/ostium version
      - run: >-
          .venv/bin/python -c "from pathlib import Path; import ostium;
          p = Path(ostium.__file__).parent / 'web' / 'dist' / 'index.html';
          assert p.is_file(), p; print(p)"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl

  integration:
    runs-on: ubuntu-24.04
    needs: [python]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false
      - name: Fetch pinned sing-box for integration checks
        run: |
          curl -sL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          install -m 0755 /tmp/sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/sing-box
      - name: Build the Ostium custom core
        run: ./scripts/build-core.sh --os linux amd64
      - run: uv sync
      - run: >-
          OSTIUM_TEST_ENGINE=/usr/local/bin/sing-box
          OSTIUM_TEST_CUSTOM_ENGINE=$PWD/dist/core/ostium-core-1.14.4-ostium.1-linux-amd64/sing-box
          uv run pytest -m integration
