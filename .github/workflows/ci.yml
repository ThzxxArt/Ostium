name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src/ostium
      - run: uv run pytest --cov=ostium --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run format:check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  wheel:
    runs-on: ubuntu-24.04
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: uv build
      - run: uv run python -m pip install dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  integration:
    runs-on: ubuntu-24.04
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - name: Fetch pinned sing-box for integration checks
        run: |
          curl -sL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          install -m 0755 /tmp/sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/sing-box
      - run: uv sync
      - run: OSTIUM_TEST_ENGINE=/usr/local/bin/sing-box uv run pytest -m integration
