name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src/ostium
      - run: >-
          uv run pytest -m "not integration" --cov=ostium --cov-report=xml
          --cov-report=json:coverage.json --cov-report=term
      - run: uv run python scripts/coverage_gate.py coverage.json
      - name: Audit Python dependencies
        run: |
          uv export --no-hashes --no-emit-project --all-groups -o /tmp/requirements.txt
          uv run pip-audit --strict -r /tmp/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --registry=https://registry.npmjs.org
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run format:check
        working-directory: web

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: test -f web/dist/index.html
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/ostium-wheel
          uv pip install --python /tmp/ostium-wheel/bin/python dist/*.whl
          /tmp/ostium-wheel/bin/ostium version
          /tmp/ostium-wheel/bin/python - <<'PY'
          from pathlib import Path

          import ostium

          asset = Path(ostium.__file__).parent / "web" / "dist" / "index.html"
          assert asset.is_file(), asset
          print("wheel SPA:", asset)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*

  core:
    uses: ./.github/workflows/core-build.yml
    permissions:
      contents: read

  windows:
    needs: [wheel, core]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - name: Download core artifact
        uses: actions/download-artifact@v8
        with:
          name: core-windows-amd64
          path: dist/core-artifact
      - name: Prepare core and Wintun
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/core | Out-Null
          tar -xzf (Get-ChildItem dist/core-artifact/ostium-core-*-windows-amd64.tar.gz).FullName -C dist/core
          Invoke-WebRequest -UseBasicParsing -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile dist/wintun.zip
          Expand-Archive dist/wintun.zip -DestinationPath dist/wintun -Force
          Copy-Item dist/wintun/bin/amd64/wintun.dll dist/core/wintun.dll
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-windows.ps1 -Version $version -CoreBinary dist/core/sing-box.exe -WintunDll dist/core/wintun.dll
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc deploy/windows/ostium.iss /DAppVersion=$version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/windows/*-setup.exe

  docker:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/thzxxart/ostium
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OSTIUM_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [verify, wheel, core, windows, docker]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/core
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/windows
      - run: >-
          python3 scripts/build-core-manifest.py --dir dist/core
          --release-version "${{ github.ref_name }}"
          --output dist/core-manifest.json
      - name: Drop downloaded core manifest
        run: rm -f dist/core/core-manifest.json
      - name: Stage Python distributions
        run: |
          mkdir -p dist/pypi
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp {} dist/pypi/ \;
          test -n "$(find dist/pypi -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist/pypi -maxdepth 1 -name '*.tar.gz' -print -quit)"
          if find dist/pypi -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' \
            | grep -q .; then
            echo "unexpected file in dist/pypi" >&2
            exit 1
          fi
      - name: Stage flat release assets
        run: |
          mkdir -p dist/release
          cp dist/*.whl dist/*.tar.gz dist/release/
          cp scripts/install-online.sh scripts/install-online.ps1 dist/release/
          cp dist/core/*.tar.gz dist/core/*.sha256 dist/release/
          cp dist/core-manifest.json dist/release/
          cp dist/windows/*-setup.exe dist/release/
      - name: Verify core checksums
        run: cd dist/release && sha256sum -c ./*.sha256
      - name: Checksums
        run: |
          cd dist/release
          rm -f SHA256SUMS
          # GitHub Release exposes every asset by basename.  Checksums must use
          # the same flat names, or `sha256sum -c` fails after download.
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/install-online.sh
            dist/release/install-online.ps1
            dist/release/*.sha256
            dist/release/core-manifest.json
            dist/release/*-setup.exe
            dist/release/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/install-online.sh
            dist/release/install-online.ps1
            dist/release/*.sha256
            dist/release/core-manifest.json
            dist/release/*-setup.exe
            dist/release/SHA256SUMS
          generate_release_notes: true
