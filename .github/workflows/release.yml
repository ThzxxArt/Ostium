name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src/ostium
      - run: >-
          uv run pytest -m "not integration" --cov=ostium --cov-branch --cov-report=xml
          --cov-report=json:coverage.json --cov-report=term
      - run: uv run python scripts/coverage_gate.py coverage.json
      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh deploy/**/*.sh install.sh deploy/launchd/*.sh
          bash -n scripts/*.sh deploy/**/*.sh install.sh deploy/launchd/*.sh
      - name: Docs
        run: uvx --from mkdocs-material==9.7.0 mkdocs build --strict
      - name: Audit Python dependencies
        run: |
          uv export --no-hashes --no-emit-project --all-groups -o /tmp/requirements.txt
          uv run pip-audit --strict -r /tmp/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --registry=https://registry.npmjs.org
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start Ostium for E2E
        run: |
          export OSTIUM_ROLE=server
          export OSTIUM_DATA_DIR=/tmp/ostium-e2e
          export OSTIUM_PORT=18443
          export OSTIUM_DEV=1
          .venv/bin/ostium init --role server --no-input --password 'verysecret123' --domain example.com
          nohup .venv/bin/ostium serve > /tmp/ostium-e2e.log 2>&1 &
          echo $! > /tmp/ostium-e2e.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18443/healthz && break; sleep 1; done
      - run: npx playwright test
        working-directory: web
        env:
          OSTIUM_BASE_URL: http://127.0.0.1:18443
          OSTIUM_ADMIN_PASSWORD: verysecret123
      - name: Stop Ostium
        if: always()
        run: |
          if [ -f /tmp/ostium-e2e.pid ]; then kill "$(cat /tmp/ostium-e2e.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: test -f web/dist/index.html
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/ostium-wheel
          uv pip install --python /tmp/ostium-wheel/bin/python dist/*.whl
          /tmp/ostium-wheel/bin/ostium version
          /tmp/ostium-wheel/bin/python - <<'PY'
          from pathlib import Path

          import ostium

          asset = Path(ostium.__file__).parent / "web" / "dist" / "index.html"
          assert asset.is_file(), asset
          print("wheel SPA:", asset)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  core:
    uses: ./.github/workflows/core-build.yml
    permissions:
      contents: read

  windows:
    needs: [wheel, core]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - name: Download core artifact
        uses: actions/download-artifact@v8
        with:
          name: core-windows-amd64
          path: dist/core-artifact
      - name: Prepare core and Wintun
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/core | Out-Null
          tar -xzf (Get-ChildItem dist/core-artifact/ostium-core-*-windows-amd64.tar.gz).FullName -C dist/core
          Invoke-WebRequest -UseBasicParsing -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile dist/wintun.zip
          $expected = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          $actual = (Get-FileHash -LiteralPath dist/wintun.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Wintun SHA256 mismatch: $actual" }
          Expand-Archive dist/wintun.zip -DestinationPath dist/wintun -Force
          $wintun = Get-ChildItem dist/wintun -Recurse -Filter wintun.dll |
            Where-Object { $_.FullName -match '[\\/]amd64[\\/]' } |
            Select-Object -First 1
          if (-not $wintun) { throw "wintun.dll (amd64) not found in the archive" }
          Copy-Item $wintun.FullName dist/core/wintun.dll
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-windows.ps1 -Version $version -CoreBinary dist/core/sing-box.exe -WintunDll dist/core/wintun.dll
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/install-online.ps1",
            "scripts/build-windows.ps1",
            "deploy/windows/install.ps1",
            "deploy/windows/uninstall.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$file has $($errors.Count) parse error(s): $($errors[0])" }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc deploy/windows/ostium.iss /DAppVersion=$version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/windows/*-setup.exe

  macos:
    needs: [wheel, core]
    # macos-14 currently resolves to an arm64 runner that is unavailable for
    # this repository; macos-13 (Intel) can still package the arm64 DMG.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - name: Download darwin arm64 core
        uses: actions/download-artifact@v8
        with:
          name: core-darwin-arm64
          path: dist
      - name: Build DMG
        env:
          OSTIUM_CODESIGN_IDENTITY: ${{ secrets.OSTIUM_CODESIGN_IDENTITY }}
          OSTIUM_NOTARY_PROFILE: ${{ secrets.OSTIUM_NOTARY_PROFILE }}
        run: |
          chmod +x scripts/build-macos.sh
          VERSION="${{ github.ref_name }}"
          ./scripts/build-macos.sh "${VERSION#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg

  linux-packages:
    needs: [wheel, core]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v8
        with:
          name: core-linux-${{ matrix.arch }}
          path: dist
      - run: uv sync
      - run: uv run pyinstaller --noconfirm --clean deploy/pyinstaller/ostium.spec
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file desktop-file-utils squashfs-tools
      - name: Build DEB and AppImage
        run: |
          chmod +x scripts/build-linux-packages.sh
          CORE="$(find dist -maxdepth 1 -name 'ostium-core-*-linux-${{ matrix.arch }}.tar.gz' | head -1)"
          ./scripts/build-linux-packages.sh --version "${{ github.ref_name }}" \
            --arch "${{ matrix.arch }}" --core "$CORE"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/packages/*

  docker:
    # Do not move GHCR tags for a version whose platform artifacts failed.
    needs: [verify, wheel, windows, macos, linux-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          # Buildx cleanup can hang on ephemeral runners after a successful
          # multi-arch push; the runner is discarded afterwards anyway.
          cleanup: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/thzxxart/ostium
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OSTIUM_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [verify, wheel, core, windows, macos, linux-packages, docker]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/core
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-packages-*
          merge-multiple: true
          path: dist/packages
      - name: Generate application SBOM
        run: uv run python scripts/build-sbom.py --output dist/ostium-sbom.cdx.json
      - run: >-
          python3 scripts/build-core-manifest.py --dir dist/core
          --release-version "${{ github.ref_name }}"
          --output dist/core-manifest.json
      - name: Drop downloaded core manifest
        run: rm -f dist/core/core-manifest.json
      - name: Stage Python distributions
        run: |
          mkdir -p dist/pypi
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp {} dist/pypi/ \;
          test -n "$(find dist/pypi -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist/pypi -maxdepth 1 -name '*.tar.gz' -print -quit)"
          if find dist/pypi -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' \
            | grep -q .; then
            echo "unexpected file in dist/pypi" >&2
            exit 1
          fi
      - name: Stage flat release assets
        run: |
          mkdir -p dist/release
          cp dist/*.whl dist/*.tar.gz dist/release/
          cp scripts/install-online.sh scripts/install-online.ps1 dist/release/
          cp dist/core/*.tar.gz dist/core/*.sha256 dist/release/
          cp dist/core-manifest.json dist/release/
          cp dist/windows/*-setup.exe dist/release/
          cp dist/*.dmg dist/release/
          cp dist/packages/*.deb dist/packages/*.AppImage dist/release/
          cp dist/ostium-sbom.cdx.json dist/release/
      - name: Verify core checksums
        run: cd dist/release && sha256sum -c ./*.sha256
      - name: Checksums
        run: |
          cd dist/release
          rm -f SHA256SUMS
          # GitHub Release exposes every asset by basename.  Checksums must use
          # the same flat names, or `sha256sum -c` fails after download.
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/install-online.sh
            dist/release/install-online.ps1
            dist/release/*.sha256
            dist/release/core-manifest.json
            dist/release/*-setup.exe
            dist/release/*.dmg
            dist/release/*.deb
            dist/release/*.AppImage
            dist/release/ostium-sbom.cdx.json
            dist/release/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
      - uses: softprops/action-gh-release@v3
        with:
          overwrite_files: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/install-online.sh
            dist/release/install-online.ps1
            dist/release/*.sha256
            dist/release/core-manifest.json
            dist/release/*-setup.exe
            dist/release/*.dmg
            dist/release/*.deb
            dist/release/*.AppImage
            dist/release/ostium-sbom.cdx.json
            dist/release/SHA256SUMS
