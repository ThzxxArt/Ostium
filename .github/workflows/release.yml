name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv build
      - run: sha256sum dist/* > dist/SHA256SUMS-wheel.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  core:
    uses: ./.github/workflows/core-build.yml
    permissions:
      contents: read

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thzxxart/ostium:${{ github.ref_name }}
            ghcr.io/thzxxart/ostium:latest

  publish:
    needs: [wheel, core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/core
      - run: python3 scripts/build-core-manifest.py --dir dist/core --output dist/core-manifest.json
      - name: Checksums
        run: |
          cd dist
          sha256sum $(find . -type f ! -name SHA256SUMS ! -name '*.sig' | sort) > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/**"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/core/*.tar.gz
            dist/core/*.sha256
            dist/core-manifest.json
            dist/SHA256SUMS
          generate_release_notes: true
