name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: test -f web/dist/index.html
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.14"
      - run: uv build
      - run: sha256sum dist/* > dist/SHA256SUMS-wheel.txt
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*

  core:
    uses: ./.github/workflows/core-build.yml
    permissions:
      contents: read

  windows:
    needs: [wheel, core]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.14"
      - name: Download core artifact
        uses: actions/download-artifact@v8
        with:
          name: core-windows-amd64
          path: dist/core-artifact
      - name: Prepare core and Wintun
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/core | Out-Null
          tar -xzf (Get-ChildItem dist/core-artifact/ostium-core-*-windows-amd64.tar.gz).FullName -C dist/core
          Invoke-WebRequest -UseBasicParsing -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile dist/wintun.zip
          Expand-Archive dist/wintun.zip -DestinationPath dist/wintun -Force
          Copy-Item dist/wintun/bin/amd64/wintun.dll dist/core/wintun.dll
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-windows.ps1 -Version $version -CoreBinary dist/core/sing-box.exe -WintunDll dist/core/wintun.dll
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc deploy/windows/ostium.iss /DAppVersion=$version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/windows/*-setup.exe

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thzxxart/ostium:${{ github.ref_name }}
            ghcr.io/thzxxart/ostium:latest

  publish:
    needs: [wheel, core, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/core
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/windows
      - run: >-
          python3 scripts/build-core-manifest.py --dir dist/core
          --release-version "${{ github.ref_name }}"
          --output dist/core-manifest.json
      - name: Checksums
        run: |
          cd dist
          sha256sum $(find . -type f ! -name SHA256SUMS ! -name '*.sig' | sort) > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/**"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/core/*.tar.gz
            dist/core/*.sha256
            dist/core-manifest.json
            dist/windows/*-setup.exe
            dist/SHA256SUMS
          generate_release_notes: true
