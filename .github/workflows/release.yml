name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src/ostium
      - run: uv run pytest -m "not integration" -q
      - name: Audit Python dependencies
        run: |
          uv export --no-hashes --no-emit-project --all-groups -o /tmp/requirements.txt
          uv run pip-audit --strict -r /tmp/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --registry=https://registry.npmjs.org
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run format:check
        working-directory: web

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: test -f web/dist/index.html
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*

  core:
    uses: ./.github/workflows/core-build.yml
    permissions:
      contents: read

  windows:
    needs: [wheel, core]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - name: Download core artifact
        uses: actions/download-artifact@v8
        with:
          name: core-windows-amd64
          path: dist/core-artifact
      - name: Prepare core and Wintun
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/core | Out-Null
          tar -xzf (Get-ChildItem dist/core-artifact/ostium-core-*-windows-amd64.tar.gz).FullName -C dist/core
          Invoke-WebRequest -UseBasicParsing -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile dist/wintun.zip
          Expand-Archive dist/wintun.zip -DestinationPath dist/wintun -Force
          Copy-Item dist/wintun/bin/amd64/wintun.dll dist/core/wintun.dll
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-windows.ps1 -Version $version -CoreBinary dist/core/sing-box.exe -WintunDll dist/core/wintun.dll
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc deploy/windows/ostium.iss /DAppVersion=$version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/windows/*-setup.exe

  docker:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OSTIUM_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/thzxxart/ostium:${{ github.ref_name }}
            ghcr.io/thzxxart/ostium:latest

  publish:
    needs: [verify, wheel, core, windows, docker]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/core
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/windows
      - run: >-
          python3 scripts/build-core-manifest.py --dir dist/core
          --release-version "${{ github.ref_name }}"
          --output dist/core-manifest.json
      - name: Drop downloaded core manifest
        run: rm -f dist/core/core-manifest.json
      - name: Stage Python distributions
        run: |
          mkdir -p dist/pypi
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp {} dist/pypi/ \;
          test -n "$(find dist/pypi -maxdepth 1 -type f -print -quit)"
      - name: Checksums
        run: |
          cd dist
          sha256sum $(find . -type f ! -name SHA256SUMS ! -name '*.sig' ! -path './pypi/*' | sort) > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/core/*.tar.gz
            dist/core/*.sha256
            dist/core-manifest.json
            dist/windows/*-setup.exe
            dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/core/*.tar.gz
            dist/core/*.sha256
            dist/core-manifest.json
            dist/windows/*-setup.exe
            dist/SHA256SUMS
          generate_release_notes: true
