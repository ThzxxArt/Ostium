name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: bash scripts/build-css.sh
      - run: bash scripts/build-core.sh
      - run: uv build
      - run: cp dist/sing-box* . && sha256sum dist/* sing-box sing-box.sha256 sing-box.sbom.json > SHA256SUMS
      - run: bash scripts/verify-release.sh .
      - uses: actions/upload-artifact@v4
        with:
          name: ostium-server-${{ inputs.version }}
          path: |
            dist/*
            sing-box
            sing-box.sha256
            sing-box.sbom.json
            SHA256SUMS
      - name: Summary
        run: |
          echo "Ostium Server ${{ inputs.version }} artifacts" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
