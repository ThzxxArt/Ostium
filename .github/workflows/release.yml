name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        required: true
      publish_pypi:
        description: "Publish the built wheel/sdist to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - name: Set release version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          version = "${{ inputs.version }}"
          Path("VERSION").write_text(version + "\n")
          path = Path("pyproject.toml")
          path.write_text(re.sub(r'^version = ".*"$', f'version = "{version}"', path.read_text(), count=1, flags=re.M))
          PY
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q --cov=src/ostium --cov-report=term
      - run: uv run bandit -q -r src -ll
      - run: uv run pip-audit
      - run: bash scripts/build-css.sh
      - run: bash scripts/build-core.sh
      - run: uv build
      - run: cp dist/sing-box* . && sha256sum dist/* sing-box sing-box.sha256 sing-box.sbom.json > SHA256SUMS
      - run: bash scripts/verify-release.sh .
      - uses: actions/upload-artifact@v4
        with:
          name: ostium-server-${{ inputs.version }}
          path: |
            dist/*
            sing-box
            sing-box.sha256
            sing-box.sbom.json
            SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Summary
        run: |
          echo "Ostium Server ${{ inputs.version }} artifacts" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  publish-pypi:
    needs: build
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
