name: pypi

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target package index"
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run mkdocs build --strict
      - run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
