name: Core build

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Build pinned core
        run: ./scripts/build-core.sh --os ${{ matrix.os }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/core/ostium-core-*.tar.gz
            dist/core/ostium-core-*.sha256

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/core
      - run: python3 scripts/build-core-manifest.py --dir dist/core --output dist/core-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-manifest
          path: dist/core-manifest.json
