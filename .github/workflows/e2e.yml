name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: uv sync
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start Ostium
        run: |
          export OSTIUM_ROLE=server
          export OSTIUM_DATA_DIR=/tmp/ostium-e2e
          export OSTIUM_PORT=18443
          export OSTIUM_DEV=1
          .venv/bin/ostium init --role server --no-input --password 'verysecret123' --domain example.com
          # Run the venv entry point directly so no uv process holds the cache lock.
          nohup .venv/bin/ostium serve > /tmp/ostium-e2e.log 2>&1 &
          echo $! > /tmp/ostium-e2e.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18443/healthz && break; sleep 1; done
      - run: npx playwright test
        working-directory: web
        env:
          OSTIUM_BASE_URL: http://127.0.0.1:18443
          OSTIUM_ADMIN_PASSWORD: verysecret123
      - name: Stop Ostium
        if: always()
        run: |
          if [ -f /tmp/ostium-e2e.pid ]; then
            kill "$(cat /tmp/ostium-e2e.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
