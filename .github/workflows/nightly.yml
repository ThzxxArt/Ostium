name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.14"
      - name: Fetch pinned core
        run: |
          curl -sL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          install -m 0755 /tmp/sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/sing-box
      - run: uv sync
      - run: OSTIUM_TEST_ENGINE=/usr/local/bin/sing-box uv run pytest -m "integration or slow" --durations=20
      - name: Config generation and validation soak
        run: |
          uv run python scripts/soak-config.py \
            --engine /usr/local/bin/sing-box \
            --iterations 100
